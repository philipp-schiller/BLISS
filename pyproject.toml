[project]
name = "bayes-shape-fitting"
version = "0.1.0"
description = ""
authors = [
    {name = "Philipp Schiller",email = "philipp.schiller@tuni.fi"}
]
readme = "README.md"
requires-python = ">=3.13, <3.15"
dependencies = [
    "numpy (>=2.0.0,<3.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "mpld3 (>=0.5.12,<0.6.0)",
    "emcee (>=3.1.6,<4.0.0)",
    "pymc (>=5.27.1,<6.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]

[tool.poetry]
packages = [{include = "bayes_shape_fitting", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
