[pytest]
# Register your custom markers so -m filtering works and warnings disappear.
markers =
    quad: marks tests involving Quad curves
    curve: marks tests involving curve shapes
    bezier: marks tests involving Bezier curves
    ellipse: marks tests involving Ellipse curves
    ellipsoid: marks tests involving Ellipsoid surfaces
    surface: marks tests involving surface shapes

# Avoid very verbose tracebacks
addopts = -ra

# If your package imports are relative and you want to run from project root,
# uncomment to add project root to import path.
pythonpath = .